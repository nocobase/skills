name: RunJS authoring contract

on:
  workflow_dispatch:
  push:
    branches:
      - improve-runjs-modules
    paths:
      - "skills/nocobase-ui-builder/**"
      - ".github/workflows/runjs-authoring-contract.yml"
  pull_request:
    paths:
      - "skills/nocobase-ui-builder/**"
      - ".github/workflows/runjs-authoring-contract.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runjs-authoring-contract-cross-repo:
    name: RunJS authoring contract cross-repo
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Skills
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout NocoBase contract branch
        uses: actions/checkout@v4
        with:
          repository: nocobase/nocobase
          ref: improve-runjs-modules
          path: nocobase
          persist-credentials: false

      - name: Record exact checkout SHAs
        shell: bash
        run: |
          set -euo pipefail
          skills_sha="$(git rev-parse HEAD)"
          nocobase_sha="$(git -C nocobase rev-parse HEAD)"
          echo "Skills SHA: $skills_sha"
          echo "NocoBase SHA: $nocobase_sha"
          {
            echo '### RunJS authoring contract checkouts'
            echo "- Skills: \`$skills_sha\`"
            echo "- NocoBase: \`$nocobase_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: nocobase/yarn.lock

      - name: Install NocoBase dependencies
        run: |
          yarn --cwd nocobase install --frozen-lockfile
          yarn --cwd nocobase add sqlite3 --no-save -W

      - name: Run NocoBase contracts
        working-directory: nocobase
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: /tmp/runjs-authoring-contract.sqlite
          LOGGER_LEVEL: error
        run: bash scripts/runjs-authoring-contract-tests.sh

      - name: Run Skills contracts
        run: npm --prefix skills/nocobase-ui-builder/runtime test

      - name: Verify cross-repository product contract
        env:
          NOCOBASE_REPO: ${{ github.workspace }}/nocobase
        run: npm --prefix skills/nocobase-ui-builder/runtime run test:product-contract
