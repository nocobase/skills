interface:
  display_name: "NocoBase AI Employee Manager"
  short_description: "Maintain AI employees and answer sources safely"
  default_prompt: >
    Use $nocobase-ai-employee-manager as the sole owner of supported NocoBase AI employee
    record writes. Inspect without unnecessary prerequisite work; use $nocobase-ai-manager
    only for changed model settings. Before any knowledge-base field write, consume a
    Professional-or-higher capability and exact-key result from
    $nocobase-ai-knowledge-base-manager. Write enableKnowledgeBase, knowledgeBasePrompt,
    and knowledgeBase together, require the literal {knowledgeBaseData} placeholder, and
    never silently downgrade a requested KB employee on an unsupported environment. Verify
    every write and require fresh exact-target confirmation before destructive or
    user-facing availability/answer-source changes.

policy:
  allow_implicit_invocation: true
