interface:
  display_name: "NocoBase AI Knowledge Base Manager"
  short_description: "Gate and maintain Professional+ knowledge bases safely"
  default_prompt: >
    Use $nocobase-ai-knowledge-base-manager for every NocoBase knowledge-base intent. State
    first that @nocobase/plugin-ai-knowledge-base requires Professional Edition or higher,
    then classify entitlement, installed/enabled plugin state, runtime API capability, and ACL
    separately. Never infer Community Edition from a missing command or unavailable license
    metadata. If a required plugin is installed but disabled, show the exact package and environment,
    ask whether to enable it, and after explicit approval use $nocobase-plugin-manage with post-state
    verification; do not merely tell the user to enable it manually. Refresh runtime metadata and
    re-check KB API and ACL after enablement. Stop before all KB resource mutations unless runtime
    capability is available. Before vector database create/update, require a direct-CLI-versus-UI
    choice. For UI mode, hand off to $nocobase-ai-manager, wait for user completion, and consume
    independent safe-field readback. After the gate, manage PGVector, Local/Readonly/External
    knowledge bases, documents, independent retries, and hit tests with safe readback and asynchronous
    boundaries. Prepare employee binding inputs including knowledgeBasePrompt with
    {knowledgeBaseData}, but delegate the final employee write to $nocobase-ai-employee.
    Use $nocobase-ai-manager only after capability passes for LLM and embedding readiness.
    Require fresh exact-target confirmation before every vector database, knowledge base, or
    document deletion.

policy:
  allow_implicit_invocation: true
