interface:
  display_name: "NocoBase UI Builder"
  short_description: "Route Modern page work through flow-surfaces Hosts/UI and run-js-sources Inline Workspaces"
  default_prompt: |-
    Routes Host/UI=`nb api flow-surfaces`; Workspace=`nb api run-js-sources`.
    Intent-firstwholePage1 tabcomplex multi-blocknested popupmulti-reactionreadsmetadataokapply-blueprintlocalized editsbackend actionsget-reaction-metafirst writeapplyBlueprintno createMenu/createPage/compose/configure/updateSettings/add*/move*/remove*/set*Rulesfail->repair aggregate errors+retry<=5success only explicit local/live gapreportRepeat-eligiblecontextual list-templateskeyword-only searchdiscovery-onlylocal customizationtemplate sourcefirst resultpage wording≠local-only intentask, not copysame-titlerouteIdpageSchemaUidsame-groupsame-titlereplacedifferent-groupsame-titlenomergesemantic AntDesign iconmulti-non-filter keyed layout/titlestemplates exemptsingle non-filteroptionalunless askedhostBound搜索/filtersameHostfilterActionoptionalsetLayoutstring[][]number[][[a],[b]]2col[[a,b]]stackuid not keysearchPage≠filterfilter/search blockfilterForm4+ fieldscollapserow1defaultFilteromitbackend4explicitemptyinvalid<4errorsraw payload onlytreeTableomitrecordActionsdefaultaddChildEFmoveNoInjectfirstlivedirectnon-assoctitleField>name>code>title分析看板KPIJSBlocktrenddistributionrankingpercentage占比 chartrequiredtable/list!=chartchartassets.charts+block.chartcardGridban(top-level code/version,changes.settings,stepParams禁,propsdecoratorPropsflowRegistry)typejsBlockonlykanban/pipeline/status columnsKanbanassociatedRecords+associationField1 editFormtryTemplatesaveAsTemplate
    Rebuild defaults.collections from scratch via live metadata. Use defaults.collections fieldGroups only for more than 10 effective fields; defaults fieldGroups self-review approve/regenerate once with lowest reasoning/no-think and no chain-of-thought. Keep fixed view/addNew/edit, the table addNew threshold, associations popups{name,description} keyed by first-segment, and structured formBehavior or formBehaviorDescriptionReview.fields.<field>{decision,reasonCode} with no legacy review/empty-object fallback.

    Before complete RunJS authoring, run `nb api run-js-sources capabilities -j`; record authoringContractVersion and Inline ownerKinds/modelUses/saveMode/supportsMaterialize plus externalization. The modelUses all use Host -> canonical locator -> Inline Workspace. Copy canonical runJSLocator; require workspaceStatus=ready -> open -> Settings Pass -> save-changes.
    Define meaningful Settings in src/client/entry.json and read them through ctx.settings. Preserve exceptions, falsy values, and Host/source separation; never expose secrets, UIDs, tokens, arbitrary code, module paths, debug keys, or native Host settings.
    save-changes sends only changed paths: omitted paths remain unchanged, use an explicit delete, upserts carry complete content and expectedBlobHash from open, and new files use null. The manifest is server-managed. compile-preview is optional for dry-run/debug. Diagnostics commit nothing; repair on the same base. For RUNJS_FILE_CONFLICT, BASE_COMMIT_OUTDATED, or owner outdated, open-latest, merge by path, and use fresh hashes/CAS tokens; never replace tokens alone.
    Four-way gate: new backend API/table/migration/ACL enforcement/server capability -> NocoBase Plugin; multiple Hosts share one maintained JS implementation without copied code -> JS Template; reusable UI/Flow structure without shared JS implementation -> UI Template; one Host exclusively owns JS -> Inline RunJS. Existing ACL/data-model admin -> specialist skills. Never confuse UI Template with JS Template.
    First match wins. Single-Host Git/distribution stays Inline; shared JS uses JS Template. Multiple files/imports/hooks/services/size/complexity/dashboard alone do not trigger JS Template. User need not name JS Template; missing capability stops.
    Existing Source Project must be explicit/current/same-task; else create New and separately name Template Entry.
    Save as/Detach need non-empty idempotency keys; Detach needs current expectedProjectHeadCommitId. Same request keeps key; changed request needs a new one. Stale Head => 409/no partial mutation.
    Persist only sourceMode=js-template + sourceBinding={type:js-template-entry,projectId,templateId,kind}; catalog resolves metadata. Usage excludes owner_missing, hides owners as aggregates, and blocks deletion while effective.
    Embedded/default/linkage/workflow/chart/flowRegistry stays single-surface. Only embedded/single-surface, compatibility-single-file, or 2 gated JS Block fallbacks keep settings.code/settings.version or configure changes.code/changes.version. A complete JS Block may use minimal safe settings.code placeholder; final business source belongs in Workspace. Explicit multi-file intent with missing capability/locator/readiness stops; never downgrade to settings.code, ordinary JS Block, another Surface, or JS Template. JS Page capability failure stops; never fake an ordinary page plus JS Block.
    Completion: save-changes success; no errors; new commit and owner fingerprint; no auto-created Source Project/Template Entry. Host Preview only if run.

dependencies:
  tools:
    - type: "cli"
      value: "nb"
      description: "Use nb api flow-surfaces for Host/UI operations and nb api run-js-sources for complete Inline Workspace source"

policy:
  allow_implicit_invocation: true
