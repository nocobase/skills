interface:
  display_name: "NocoBase UI Builder"
  short_description: "Build Modern UI with flow-surfaces, Inline Workspaces, and JS Template authoring"
  default_prompt: |-
    Routes Host/UI=`nb api flow-surfaces`; Workspace=`nb api run-js-sources`.
    Intent-firstwholePage1 tabcomplex multi-blocknested popupmulti-reactionreadsmetadataokapply-blueprintlocalized editsbackend actionsget-reaction-metafirst writeapplyBlueprintno createMenu/createPage/compose/configure/updateSettings/add*/move*/remove*/set*Rulesfail->repair aggregate errors+retry<=5success only explicit local/live gapreportRepeat-eligiblecontextual list-templateskeyword-only searchdiscovery-onlylocal customizationtemplate sourcefirst resultpage wording≠local-only intentask, not copysame-titlerouteIdpageSchemaUidsame-groupsame-titlereplacedifferent-groupsame-titlenomergesemantic AntDesign iconmulti-non-filter keyed layout/titlestemplates exemptsingle non-filteroptionalunless askedhostBound搜索/filtersameHostfilterActionoptionalsetLayoutstring[][]number[][[a],[b]]2col[[a,b]]stackuid not keysearchPage≠filterfilter/search blockfilterForm4+ fieldscollapserow1defaultFilteromitbackend4explicitemptyinvalid<4errorsraw payload onlytreeTableomitrecordActionsdefaultaddChildEFmoveNoInjectfirstlivedirectnon-assoctitleField>name>code>title分析看板KPIJSBlocktrenddistributionrankingpercentage占比 chartrequiredtable/list!=chartchartassets.charts+block.chartcardGridban(top-level code/version,changes.settings,stepParams禁,propsdecoratorPropsflowRegistry)typejsBlockonlykanban/pipeline/status columnsKanbanassociatedRecords+associationField1 editFormtryTemplatesaveAsTemplate
    Rebuild defaults.collections from scratch via live metadata. defaults fieldGroups only >10 effective fields; self-review approve/regenerate once, lowest reasoning/no-think/no CoT. Fixed view/addNew/edit; table addNew threshold; associations popups{name,description} keyed first-segment; formBehavior or formBehaviorDescriptionReview.fields.<field>{decision,reasonCode}; no legacy/empty fallback.

    Before RunJS authoring run `nb api run-js-sources capabilities -j`; record authoringContractVersion, Inline ownerKinds/modelUses/saveMode/supportsMaterialize+externalization. modelUses all use Host -> canonical locator -> Inline Workspace; copy canonical runJSLocator; require workspaceStatus=ready -> open -> Settings Pass -> save-changes.
    Settings in src/client/entry.json and ctx.settings; preserve exceptions/falsy/Host-source separation; never expose secrets, UIDs/tokens, arbitrary code/module paths, debug keys, or native Host settings.
    save-changes: changed paths only. Omitted paths remain unchanged; explicit delete; upserts=content+expectedBlobHash from open; new files=null; manifest server-managed. compile-preview optional dry-run/debug. Diagnostics commit nothing; repair same base. RUNJS_FILE_CONFLICT/BASE_COMMIT_OUTDATED/owner outdated -> open-latest, merge paths, fresh hashes/CAS; never replace tokens alone.
    Four-way gate: new backend API/table/migration/ACL enforcement/server capability -> NocoBase Plugin; explicit create/use/Save as/reusable/distributable JS Template or multiple compatible Hosts share one maintained JS implementation without copied code -> JS Template; reusable UI/Flow structure without shared JS -> UI Template; one Host exclusively owns JS -> Inline RunJS. Existing ACL/data-model admin -> specialist skills.
    Single-Host Git storage/ownership or vague future distribution stays Inline. Multiple files/imports/hooks/complexity/dashboard do not trigger JS Template; missing capability stops.
    JS_TEMPLATE_CONTRACT_V1={"routes":["nocobase-plugin","js-template","ui-template","inline-runjs"],"match":"first","outcomes":{"saveAs":"head,template,runtime,binding,readback,idem","sharedEdit":"snapshot,delta,head,compiled,runtime,usage,bindings,settings","detach":"request,cas,repo,commit,owner,hash,source,binding,usage,others","stop":{"capability":"incomplete,noFallback","unsaved":"saveOrDiscard,committedOnly"}}}
    Inline: Host ready; save-changes succeeds/no errors; new commit and owner fingerprint; no JS Template; Host Preview only if run.
    Existing Source Project only if explicit/current/same-task; else new. Name JS Template separately.
    Save as/Detach require idempotency. Detach exact fields={idempotencyKey,locator,projectId,templateId,expectedProjectHeadCommitId}, committed Head only; save/discard unsaved edits. Stale Head=409/no mutation.
    Persist sourceMode=js-template + binding={type:js-template-entry,projectId,templateId,kind}; Usage excludes owner_missing/hidden owners and blocks deletion.
    Embedded/default/linkage/workflow/chart/flowRegistry stays single-surface. compatibility-single-file uses settings.code/version + configure changes.code/changes.version; so do embedded/single-surface and 2 gated JS Block fallbacks. A complete JS Block may use a minimal safe settings.code placeholder; final business source belongs in Workspace. Explicit multi-file intent missing capability/locator/readiness stops; never downgrade to settings.code, another Surface, or JS Template. JS Page capability failure stops; never fake a page plus JS Block.
dependencies:
  tools:
    - type: "cli"
      value: "nb"
      description: "Use nb for flow-surfaces Host/UI, run-js-sources Inline Workspace, and JS Template authoring"

policy:
  allow_implicit_invocation: true
