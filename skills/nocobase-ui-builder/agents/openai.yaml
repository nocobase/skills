interface:
  display_name: "NocoBase UI Builder"
  short_description: "Route Modern page work through flow-surfaces Hosts/UI and run-js-sources Inline Workspaces"
  default_prompt: |-
    Routes Host/UI=`nb api flow-surfaces`; Workspace=`nb api run-js-sources`.
    Intent-firstwholePage1 tabcomplex multi-blocknested popupmulti-reactionreadsmetadataokapply-blueprintlocalized editsbackend actionsget-reaction-metafirst writeapplyBlueprintno createMenu/createPage/compose/configure/updateSettings/add*/move*/remove*/set*Rulesfail->repair aggregate errors+retry<=5success only explicit local/live gapreportRepeat-eligiblecontextual list-templateskeyword-only searchdiscovery-onlylocal customizationtemplate sourcefirst resultpage wording≠local-only intentask, not copysame-titlerouteIdpageSchemaUidsame-groupsame-titlereplacedifferent-groupsame-titlenomergesemantic AntDesign iconmulti-non-filter keyed layout/titlestemplates exemptsingle non-filteroptionalunless askedhostBound搜索/filtersameHostfilterActionoptionalsetLayoutstring[][]number[][[a],[b]]2col[[a,b]]stackuid not keysearchPage≠filterfilter/search blockfilterForm4+ fieldscollapserow1defaultFilteromitbackend4explicitemptyinvalid<4errorsraw payload onlytreeTableomitrecordActionsdefaultaddChildEFmoveNoInjectfirstlivedirectnon-assoctitleField>name>code>title分析看板KPIJSBlocktrenddistributionrankingpercentage占比 chartrequiredtable/list!=chartchartassets.charts+block.chartcardGridban(top-level code/version,changes.settings,stepParams禁,propsdecoratorPropsflowRegistry)typejsBlockonlykanban/pipeline/status columnsKanbanassociatedRecords+associationField1 editFormtryTemplatesaveAsTemplate
    Rebuild defaults.collections from scratch via live metadata. Use defaults.collections fieldGroups only for more than 10 effective fields; defaults fieldGroups self-review approve/regenerate once with lowest reasoning/no-think and no chain-of-thought. Keep fixed view/addNew/edit, the table addNew threshold, associations popups{name,description} keyed by first-segment, and structured formBehavior or formBehaviorDescriptionReview.fields.<field>{decision,reasonCode} with no legacy review/empty-object fallback.

    For a new complete JS Page or complete JS Block, flow-surfaces owns only the Host, navigation, layout, and Flow Model. Default the final source to an Inline Workspace: create or locate the Host, require workspaceStatus=ready, copy its canonical runJSLocator without constructing one, run `nb api run-js-sources open`, perform the Settings Pass, edit source files, and run `nb api run-js-sources save-changes` with only changed paths.
    Normally define 2-5 meaningful Settings in src/client/entry.json and read every declared value through ctx.settings. Preserve the documented exceptions, falsy values, and the separation between Host values and source commits. Do not use secrets, internal UIDs, tokens, arbitrary JS/HTML/SQL, module paths, debug cache keys, or duplicate native Host settings as configurable values.
    Omitted paths remain unchanged. Delete only with an explicit delete change. Upserts send the complete content of that changed file and the expectedBlobHash from open; new files use expectedBlobHash=null. The .nocobase/runjs-source.json manifest is server-managed: do not upload, edit, or delete it.
    save-changes is the normal full-candidate compile gate, so compile-preview is optional and reserved for an explicit dry-run, debugging, or Studio interaction. On compile diagnostics, no state was committed; repair the changed files and retry on the unchanged base. On RUNJS_FILE_CONFLICT, BASE_COMMIT_OUTDATED, or owner outdated, run open-latest, read current files and blob hashes, merge by path, and resubmit with fresh hashes and CAS tokens; never replace tokens alone.
    Multiple files, imports, hooks, services, or complexity do not trigger Light Extension. Use `nb light` only for explicit externalization such as a light plugin, cross-Host reuse, independent Git ownership, or distribution; an unnamed destination uses the application default Repository.
    Only embedded/single-surface, explicit compatibility-single-file, or the two capability-gated JS Block fallbacks may keep final source in settings.code or direct configure changes.code. A complete JS Block may use a minimal safe settings.code placeholder only when Host creation requires it, then move final business source into the Workspace. JS Page capability failure stops; never fake it with an ordinary page plus JS Block.
    Completion requires Host ready, save-changes success, an artifact with no error diagnostics, a new commit and owner fingerprint, and no automatically created Light Extension Repository. Host Preview is a non-goal and must not be claimed unless separately run.

dependencies:
  tools:
    - type: "cli"
      value: "nb"
      description: "Use nb api flow-surfaces for Host/UI operations and nb api run-js-sources for complete Inline Workspace source"

policy:
  allow_implicit_invocation: true
